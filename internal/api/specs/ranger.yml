openapi: "3.0.3"

info:
  title: ranger
  description: >
    your roadmap lives in your repo. every operation is scoped to a
    configured project by name; every read that paints state carries
    content hashes; every mutation carries them back; every mutation success
    returns a fresh board so the client repaints from disk truth. no auth,
    localhost only.
  version: 1.0.0

servers:
  - url: /api/v1

paths:
  /projects:
    get:
      operationId: getProjects
      summary: >
        the configured project index — each project's name and availability,
        judged by a fresh load at request time, plus the default.
      responses:
        "200":
          description: the project index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/projectIndex"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/board:
    parameters:
      - $ref: "#/components/parameters/project"
    get:
      operationId: getBoard
      summary: the computed board, rebuilt from a fresh read of the disk
      responses:
        "200":
          description: lanes in lifecycle order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/board"
        "400":
          $ref: "#/components/responses/wrongConvention"
        "404":
          $ref: "#/components/responses/notFound"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/search:
    parameters:
      - $ref: "#/components/parameters/project"
    get:
      operationId: searchItems
      summary: >
        case-insensitive substring search over item titles and bodies,
        against a fresh read of the disk.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: matching item filenames
          content:
            application/json:
              schema:
                type: object
                required: [filenames]
                properties:
                  filenames:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/wrongConvention"
        "404":
          $ref: "#/components/responses/notFound"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/items:
    parameters:
      - $ref: "#/components/parameters/project"
    post:
      operationId: createItem
      summary: capture a new item into inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                body:
                  type: string
      responses:
        "201":
          description: captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/itemLanded"
        "400":
          $ref: "#/components/responses/validationError"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/items/{filename}:
    parameters:
      - $ref: "#/components/parameters/project"
      - $ref: "#/components/parameters/filename"
    get:
      operationId: getItem
      summary: one item's raw content and parsed card
      responses:
        "200":
          description: the item
          content:
            application/json:
              schema:
                type: object
                required: [content, card, hash]
                properties:
                  content:
                    type: string
                  card:
                    $ref: "#/components/schemas/card"
                  hash:
                    type: string
        "400":
          $ref: "#/components/responses/wrongConvention"
        "404":
          description: no such project or item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/items/{filename}/content:
    parameters:
      - $ref: "#/components/parameters/project"
      - $ref: "#/components/parameters/filename"
    put:
      operationId: saveContent
      summary: raw save; a state-changing save runs the ranked-transition cleanup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, expectedHash, expectedOrderVersion]
              properties:
                content:
                  type: string
                expectedHash:
                  type: string
                expectedOrderVersion:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/freshBoard"
        "400":
          $ref: "#/components/responses/wrongConvention"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/items/{filename}/state:
    parameters:
      - $ref: "#/components/parameters/project"
      - $ref: "#/components/parameters/filename"
    post:
      operationId: transitionItem
      summary: transition, or transition-and-place when position is given
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, expectedHash, expectedOrderVersion]
              properties:
                state:
                  $ref: "#/components/schemas/state"
                expectedHash:
                  type: string
                expectedOrderVersion:
                  type: string
                position:
                  type: integer
                  minimum: 0
                  description: >
                    index into the destination lane's ranked list only,
                    never the displayed card sequence.
      responses:
        "200":
          $ref: "#/components/responses/freshBoard"
        "400":
          $ref: "#/components/responses/wrongConvention"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/order/{lane}:
    parameters:
      - $ref: "#/components/parameters/project"
      - name: lane
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/state"
    put:
      operationId: reorderLane
      summary: rewrite one lane's ranked prefix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filenames, expectedVersion]
              properties:
                filenames:
                  type: array
                  items:
                    type: string
                  description: >
                    only the resulting ranked prefix, never the whole
                    displayed lane; cards absent from it stay unranked.
                expectedVersion:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/freshBoard"
        "400":
          $ref: "#/components/responses/wrongConvention"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/filters:
    parameters:
      - $ref: "#/components/parameters/project"
    put:
      operationId: saveFilters
      summary: >
        replace the saved-filter set whole — .ranger/filters.yaml is
        tool-rendered, so every mutation is the full resulting set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filters, expectedVersion]
              properties:
                filters:
                  type: array
                  items:
                    $ref: "#/components/schemas/savedFilter"
                expectedVersion:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/freshBoard"
        "400":
          $ref: "#/components/responses/validationError"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/items/{filename}/delete:
    parameters:
      - $ref: "#/components/parameters/project"
      - $ref: "#/components/parameters/filename"
    post:
      operationId: deleteItem
      summary: >
        remove an item file — the operator's explicit curation gesture. the
        item's order.yaml entries go in the same gesture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedHash, expectedOrderVersion]
              properties:
                expectedHash:
                  type: string
                expectedOrderVersion:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/freshBoard"
        "400":
          $ref: "#/components/responses/wrongConvention"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/items/{filename}/retitle:
    parameters:
      - $ref: "#/components/parameters/project"
      - $ref: "#/components/parameters/filename"
    post:
      operationId: retitleItem
      summary: retitle and rename to the new slug, rank preserved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, expectedHash, expectedOrderVersion]
              properties:
                title:
                  type: string
                expectedHash:
                  type: string
                expectedOrderVersion:
                  type: string
      responses:
        "200":
          description: retitled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/itemLanded"
        "400":
          $ref: "#/components/responses/validationError"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/items/{filename}/rename-to-slug:
    parameters:
      - $ref: "#/components/parameters/project"
      - $ref: "#/components/parameters/filename"
    post:
      operationId: renameToSlug
      summary: repair the filename-mismatch flag with one rename
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedHash, expectedOrderVersion]
              properties:
                expectedHash:
                  type: string
                expectedOrderVersion:
                  type: string
      responses:
        "200":
          description: renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/itemLanded"
        "400":
          $ref: "#/components/responses/validationError"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/conflict"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/v2/project:
    parameters:
      - $ref: "#/components/parameters/project"
    get:
      operationId: getV2Project
      summary: both v2 views and their shared item summaries from a fresh load
      responses:
        "200":
          description: the v2 project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v2Project"
        "400":
          $ref: "#/components/responses/wrongConvention"
        "404":
          $ref: "#/components/responses/notFound"
        default:
          $ref: "#/components/responses/serverError"

  /projects/{project}/v2/items/{slug}:
    parameters:
      - $ref: "#/components/parameters/project"
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getV2Item
      summary: one v2 item's raw content, relationships, plan, and files
      responses:
        "200":
          description: the v2 item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v2Item"
        "400":
          $ref: "#/components/responses/wrongConvention"
        "404":
          $ref: "#/components/responses/notFound"
        default:
          $ref: "#/components/responses/serverError"

components:
  parameters:
    project:
      name: project
      in: path
      required: true
      schema:
        type: string

    filename:
      name: filename
      in: path
      required: true
      schema:
        type: string

  responses:
    freshBoard:
      description: the board after the mutation, rebuilt from disk truth
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/board"
    notFound:
      description: no such project
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    conflict:
      description: >
        guard refusal. item_conflict and order_conflict mean the view went
        stale — reload. slug_collision is a no-clobber refusal and carries
        structured recovery paths.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/conflict"
    wrongConvention:
      description: the operation belongs to another file convention.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/conventionMismatch"
    validationError:
      description: the request fails prevalidation; nothing was written
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    serverError:
      description: repository-level failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"

  schemas:
    state:
      type: string
      enum: [inbox, horizon, researching, building, evaluating]

    flag:
      type: object
      required: [kind, diagnostic]
      properties:
        kind:
          type: string
          enum: [malformed, filename-mismatch]
        diagnostic:
          type: string

    logEntry:
      type: object
      required: [stamp, note]
      properties:
        stamp:
          type: string
        note:
          type: string

    card:
      type: object
      required: [filename, title, flags, hash]
      properties:
        filename:
          type: string
        title:
          type: string
          description: empty when the title could not be read; show the filename.
        state:
          allOf:
            - $ref: "#/components/schemas/state"
          description: absent when state could not be read; the lane carries the effective placement.
        created:
          type: string
        tags:
          type: array
          items:
            type: string
        subsystems:
          type: array
          items:
            type: string
          description: parts of the stack this item impacts; most projects don't use them.
        source:
          type: string
        milestone:
          type: string
        log:
          type: array
          items:
            $ref: "#/components/schemas/logEntry"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/flag"
        hash:
          type: string
        dirty:
          type: boolean
          description: >
            true when the item's file is uncommitted in git — modified,
            staged, or untracked alike; absent when git can't answer (no
            git binary, no repository).

    savedFilter:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        notTags:
          type: array
          items:
            type: string
        subsystems:
          type: array
          items:
            type: string
        notSubsystems:
          type: array
          items:
            type: string
        milestone:
          type: string
        notMilestone:
          type: string
        noTags:
          type: boolean
          description: match only cards carrying no tags at all
        noSubsystems:
          type: boolean
          description: match only cards carrying no subsystems at all
        noMilestone:
          type: boolean
          description: match only cards with no milestone set

    lane:
      type: object
      required: [state, cards, rankedCount]
      properties:
        state:
          $ref: "#/components/schemas/state"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/card"
        rankedCount:
          type: integer
          description: >
            the first rankedCount cards are the lane's ranked prefix; the
            rest are the computed unranked tail.

    board:
      type: object
      required: [project, lanes, orderVersion]
      properties:
        project:
          type: string
          description: the configured project name.
        lanes:
          type: array
          items:
            $ref: "#/components/schemas/lane"
        orderVersion:
          type: string
          description: .ranger/order.yaml's hash, or the sentinel "absent". absence is a version.
        dirty:
          type: boolean
          description: >
            true when anything under the roadmap directory is uncommitted
            in git — items, order.yaml, and assets alike; absent when git
            can't answer.
        savedFilters:
          type: array
          items:
            $ref: "#/components/schemas/savedFilter"
          description: >
            the saved-filter set from .ranger/filters.yaml, empty
            included; absent (with filtersVersion) when the file exists
            but can't be read.
        filtersVersion:
          type: string
          description: >
            filters.yaml's hash, or the sentinel "absent". absent as a
            field when the file exists but can't be read — degraded,
            never a board failure.

    projectStatus:
      type: object
      required: [name, available]
      properties:
        name:
          type: string
        available:
          type: boolean
        error:
          type: string
          description: the repository-level error for an unavailable root.
        convention:
          type: integer
          enum: [1, 2]
          description: the detected file convention, absent when detection fails.
        dirty:
          type: boolean
          description: >
            whether anything under the convention's scope is uncommitted.
            absent when the convention is unknown or git cannot answer.

    projectIndex:
      type: object
      required: [projects, default]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/projectStatus"
        default:
          type: string

    v2Project:
      type: object
      required: [project, roadmap, queue, items, needs, flags]
      properties:
        project:
          type: string
        roadmap:
          $ref: "#/components/schemas/v2View"
        queue:
          $ref: "#/components/schemas/v2View"
        items:
          type: object
          description: item summaries keyed by directory slug.
          additionalProperties:
            $ref: "#/components/schemas/v2ItemSummary"
        needs:
          type: array
          items:
            $ref: "#/components/schemas/v2Need"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/v2Flag"

    v2View:
      type: object
      required: [lanes]
      properties:
        lanes:
          type: array
          items:
            $ref: "#/components/schemas/v2Lane"
        version:
          type: string
          description: the view file's hash, or "absent" if it does not exist.
        error:
          type: string
          description: when set, this view has no lanes or version.
        git:
          $ref: "#/components/schemas/v2GitMark"

    v2State:
      type: string
      enum: [inbox, horizon, pending, building, evaluating]

    v2Lane:
      type: object
      required: [state, items]
      properties:
        state:
          $ref: "#/components/schemas/v2State"
        items:
          type: array
          items:
            type: string
          description: directory slugs in display order.

    v2ItemSummary:
      type: object
      required: [title, state, tags, includes, requires, blockedOn, checklist, needs, flags]
      properties:
        title:
          type: string
          description: empty when unreadable.
        state:
          $ref: "#/components/schemas/v2State"
        kind:
          type: string
          enum: [epic, story, defect, punchlist]
        created:
          type: string
        since:
          type: string
        tags:
          type: array
          items:
            type: string
        includes:
          type: array
          items:
            type: string
        requires:
          type: array
          items:
            type: string
        blockedOn:
          type: array
          items:
            type: string
        checklist:
          $ref: "#/components/schemas/v2Checklist"
        progress:
          $ref: "#/components/schemas/v2Progress"
        needs:
          type: array
          items:
            $ref: "#/components/schemas/v2Need"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/v2Flag"
        git:
          $ref: "#/components/schemas/v2GitMark"

    v2Checklist:
      type: object
      required: [open, total]
      properties:
        open:
          type: integer
        total:
          type: integer

    v2Progress:
      type: object
      required: [position]
      properties:
        position:
          type: string
          enum: [no-design, designing, plan-in-review, ready-to-hand-off, no-stages, current-stage, complete]
        stage:
          type: string
        number:
          type: integer
        total:
          type: integer
        status:
          $ref: "#/components/schemas/v2StageStatus"
        verdict:
          $ref: "#/components/schemas/v2Verdict"

    v2Verdict:
      type: object
      required: [broker, value]
      properties:
        broker:
          type: string
          enum: [mercurius, terminus]
        value:
          type: string

    v2Need:
      type: object
      required: [item, acceptance]
      properties:
        item:
          type: string
        stage:
          type: string
        request:
          type: string
        acceptance:
          type: boolean

    v2Flag:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [malformed, slug-mismatch, still-building, missing-link, missing-view-item, in-neither-view, missing-stage, unlisted-stage, unreadable-plan, unreadable-stage]
        item:
          type: string
        view:
          type: string
          enum: [roadmap, queue]
        line:
          type: integer
        target:
          type: string
        relation:
          $ref: "#/components/schemas/v2Relation"
        diagnostic:
          type: string

    v2GitMark:
      type: object
      description: absent when git cannot answer.
      required: [unstaged, staged, new]
      properties:
        unstaged:
          type: boolean
        staged:
          type: boolean
        new:
          type: boolean

    v2Item:
      type: object
      required: [content, hash, summary, linksOut, linksIn, stages, files, hasDesign]
      properties:
        content:
          type: string
          description: the raw index.md.
        hash:
          type: string
        summary:
          $ref: "#/components/schemas/v2ItemSummary"
        subsystems:
          type: array
          items:
            type: string
        source:
          type: string
        milestone:
          type: string
        log:
          type: array
          items:
            $ref: "#/components/schemas/logEntry"
        linksOut:
          type: array
          items:
            $ref: "#/components/schemas/v2Link"
        linksIn:
          type: array
          items:
            $ref: "#/components/schemas/v2Link"
        hasDesign:
          type: boolean
        plan:
          $ref: "#/components/schemas/v2Plan"
        planError:
          type: string
        stages:
          type: object
          description: stage files keyed by basename without .md, including unlisted stages.
          additionalProperties:
            $ref: "#/components/schemas/v2Stage"
        files:
          type: array
          description: sidecar paths relative to the item directory.
          items:
            type: string

    v2Relation:
      type: string
      enum: [includes, requires, blocked_on, body]

    v2Link:
      type: object
      required: [from, relation, slug]
      properties:
        from:
          type: string
        relation:
          $ref: "#/components/schemas/v2Relation"
        slug:
          type: string
        project:
          type: string
          description: present for a cross-project target.

    v2Plan:
      type: object
      required: [stages]
      properties:
        mercurius:
          type: string
        stages:
          type: array
          description: ordered stage names, including missing files.
          items:
            type: string

    v2StageStatus:
      type: string
      enum: [started, built]

    v2Stage:
      type: object
      required: [needs]
      properties:
        title:
          type: string
        status:
          $ref: "#/components/schemas/v2StageStatus"
        terminus:
          type: string
        needs:
          type: array
          items:
            type: string
        accepted:
          type: string
        error:
          type: string

    itemLanded:
      type: object
      required: [filename, board]
      properties:
        filename:
          type: string
        board:
          $ref: "#/components/schemas/board"

    conflict:
      type: object
      required: [reason, message]
      properties:
        reason:
          type: string
          enum: [item_conflict, order_conflict, filters_conflict, slug_collision]
        message:
          type: string
        tempPath:
          type: string
          description: capture collisions; the preserved .capture- draft.
        sourcePath:
          type: string
          description: retitle and rename collisions; the surviving source file.
        destPath:
          type: string
          description: the colliding destination.

    conventionMismatch:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: names the project's actual and required conventions.

    errorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
